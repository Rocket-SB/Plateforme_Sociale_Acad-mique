{% extends 'base.html' %}

{% block title %}Créer un post - Plateforme Sociale Académique{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h1 class="card-title">Créer un nouveau post</h1>
    </div>
    
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        
        {% if groups %}
        <div class="form-group">
            <label for="group">Publier dans un groupe (optionnel)</label>
            <select id="group" name="group" class="form-control">
                <option value="">Aucun groupe (publication publique)</option>
                {% for group in groups %}
                <option value="{{ group.id }}">{{ group.name }}</option>
                {% endfor %}
            </select>
        </div>
        {% endif %}
        
        <div class="form-group">
            <label for="content">Contenu *</label>
            <textarea id="content" name="content" class="form-control" rows="6" required placeholder="Qu'avez-vous en tête ?"></textarea>
        </div>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
                <label for="image">Image</label>
                <input type="file" id="image" name="image" class="form-control" accept="image/*">
            </div>
            
            <div class="form-group">
                <label for="file">Fichier</label>
                <input type="file" id="file" name="file" class="form-control">
            </div>
        </div>
        
        <div style="display: flex; gap: 1rem;">
            <button type="submit" class="btn btn-success">Publier</button>
            <a href="{% url 'posts:list' %}" class="btn btn-secondary">Annuler</a>
        </div>
    </form>
</div>
{% endblock %}
